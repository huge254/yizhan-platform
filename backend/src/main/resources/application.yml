server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/yizhan?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

minio:
  endpoint: http://minio:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: yizhan-goods

jwt:
  # 32 字节密钥，HS256 要求
  secret: yizhan-platform-secret-key-2026-abcdefg
  # 有效期：毫秒，默认 24 小时
  expire-ms: 86400000
