<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>发布商品 - 易栈</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark px-3"></nav>

<div class="container mt-4" style="max-width: 680px;">
  <div class="card p-4 shadow-sm">
    <h4 class="mb-1 fw-bold">📦 发布商品</h4>
    <p class="text-muted small mb-4">填写商品信息，发布后需管理员审核通过才会展示</p>

    <div class="mb-3">
      <label class="form-label">标题 <span class="text-danger">*</span></label>
      <input id="title" class="form-control" maxlength="200" placeholder="例如：99 新机械键盘，用了不到一个月">
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">价格（元）<span class="text-danger">*</span></label>
        <input id="price" type="number" min="0.01" step="0.01" class="form-control" placeholder="必须大于 0">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">描述</label>
      <textarea id="description" class="form-control" rows="4" placeholder="成色、购买渠道、转让原因…"></textarea>
    </div>

    <div class="mb-4">
      <label class="form-label">商品图片（可选，支持 jpg / png / gif / webp）</label>
      <input id="image" type="file" class="form-control" accept="image/jpeg,image/png,image/gif,image/webp" onchange="previewImage(this)">
      <div class="mt-3 text-center">
        <img id="preview" class="rounded" style="max-height:200px;max-width:100%;display:none;box-shadow:var(--yz-shadow);">
      </div>
    </div>

    <button class="btn btn-primary btn-lg w-100" id="submit-btn" onclick="publish()">发布商品</button>
  </div>
</div>

<script src="common.js"></script>
<script>
renderNav('易栈', []);
let selectedFile = null;

if (!localStorage.getItem('token')) {
  showToast('请先登录', 'info');
  location.href = 'login.html';
}

function previewImage(input) {
  selectedFile = input.files[0] || null;
  const img = document.getElementById('preview');
  if (selectedFile) {
    img.src = URL.createObjectURL(selectedFile);
    img.style.display = '';
  } else {
    img.style.display = 'none';
  }
}

async function publish() {
  const title = document.getElementById('title').value.trim();
  const price = document.getElementById('price').value;
  const description = document.getElementById('description').value.trim();

  if (!title) return showToast('请填写标题', 'info');
  if (!price || Number(price) <= 0) return showToast('价格必须大于 0', 'info');

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '发布中…';
  try {
    let imageUrl = '';
    if (selectedFile) {
      imageUrl = await uploadFile(selectedFile);
    }
    await api('/api/goods/add', {
      method: 'POST',
      body: JSON.stringify({ title, price: Number(price), description, imageUrl })
    });
    showToast('发布成功，等待管理员审核', 'success');
    setTimeout(() => location.href = 'index.html', 900);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '发布商品';
  }
}
</script>
</body>
</html>
