<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的订单 - 易栈</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark px-3"></nav>

<div class="container mt-4">
  <div class="card p-4">
    <h5 class="mb-3 fw-bold">🧾 我的订单</h5>
    <table class="table table-hover align-middle" id="order-table">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script src="common.js"></script>
<script>
renderNav('易栈', [{ text: '＋ 发布商品', href: 'publish.html' }]);

if (!localStorage.getItem('token')) {
  showToast('请先登录', 'info');
  location.href = 'login.html';
}

async function loadOrders() {
  const res = await api('/api/order/list');
  renderTable('#order-table', res.data.list,
    [
      { key: 'id', title: '订单号' },
      { key: 'goodsTitle', title: '商品' },
      { key: 'amount', title: '金额' },
      { key: 'createdAt', title: '下单时间' }
    ],
    item => `<td>${orderBadge(item.status)} ${item.status === 0
      ? `<button class="btn btn-sm btn-success ms-2 rounded-pill px-3" onclick="confirmOrder(${item.id})">确认收货</button>`
      : ''}</td>`);
}

async function confirmOrder(orderId) {
  await api('/api/order/confirm', {
    method: 'POST',
    body: JSON.stringify({ orderId })
  });
  showToast('已确认收货，交易完成 🎉', 'success');
  loadOrders();
}

loadOrders();
</script>
</body>
</html>
