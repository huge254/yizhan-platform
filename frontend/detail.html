<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品详情 - 易栈</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark px-3"></nav>

<div class="container mt-4">
  <div class="mb-3">
    <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill">← 返回好物列表</a>
  </div>
  <div class="row g-4">
    <!-- 左侧：商品图片 -->
    <div class="col-md-6">
      <div class="card overflow-hidden">
        <div id="goods-img" class="d-flex align-items-center justify-content-center text-muted sk-shimmer" style="height:400px;">加载中…</div>
      </div>
    </div>
    <!-- 右侧：商品信息 -->
    <div class="col-md-6">
      <div class="card p-4 h-100">
        <h4 id="goods-title" class="fw-bold">-</h4>
        <div class="fs-3 yz-price my-3">￥<span id="goods-price">-</span></div>
        <div class="d-flex gap-4 mb-3 text-muted">
          <span>卖家：<strong class="text-dark" id="goods-seller">-</strong></span>
          <span>状态：<span id="goods-status"></span></span>
        </div>
        <hr>
        <div class="mb-2 text-muted small fw-bold">📝 商品描述</div>
        <div style="white-space: pre-line; min-height: 90px;" id="goods-desc">-</div>
        <div class="mt-auto pt-3">
          <button class="btn btn-danger btn-lg w-100" id="buy-btn" onclick="buy()">🛒 立即购买</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 评论区 -->
  <div class="card mt-4 p-4">
    <h5 class="mb-3">💬 评论区</h5>
    <div class="input-group mb-3">
      <input id="comment-input" class="form-control" placeholder="说点什么…（不超过 500 字）" maxlength="500" onkeydown="if(event.key==='Enter') addComment()">
      <button class="btn btn-primary" onclick="addComment()">发表评论</button>
    </div>
    <ul class="list-group list-group-flush" id="comment-list"></ul>
  </div>
</div>

<script src="common.js"></script>
<script>
renderNav('易栈', [{ text: '＋ 发布商品', href: 'publish.html' }]);
const id = getQuery('id');
if (!id) { showToast('缺少商品 id', 'error'); location.href = 'index.html'; }

async function loadDetail() {
  const res = await api('/api/goods/' + id);
  const g = res.data;
  document.getElementById('goods-title').textContent = g.title;
  document.getElementById('goods-price').textContent = g.price;
  document.getElementById('goods-seller').textContent = g.seller || '-';
  document.getElementById('goods-status').innerHTML = goodsBadge(g.status);
  document.getElementById('goods-desc').textContent = g.description || '（无描述）';
  const imgBox = document.getElementById('goods-img');
  imgBox.classList.remove('sk-shimmer');
  imgBox.innerHTML = g.imageUrl
    ? `<img src="${g.imageUrl}" style="max-height:400px;max-width:100%;" onerror="this.parentNode.textContent='图片加载失败'">`
    : '无图片';
  if (g.status !== 1) {
    const btn = document.getElementById('buy-btn');
    btn.disabled = true;
    btn.textContent = g.status === 0 ? '商品审核中' : '商品已下架';
  }
}

async function loadComments() {
  const res = await api('/api/comment/list?goodsId=' + id);
  const list = res.data.list;
  document.getElementById('comment-list').innerHTML = list.length
    ? list.map(c => `
      <li class="list-group-item px-0">
        <div class="d-flex align-items-start gap-2">
          <span style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--yz-primary),var(--yz-primary-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;">${(c.user || '匿').slice(0,1)}</span>
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between mb-1">
              <strong>${c.user}</strong>
              <span class="text-muted small">${(c.createdAt || '').replace('T', ' ').slice(0, 19)}</span>
            </div>
            <div>${c.content}</div>
          </div>
        </div>
      </li>`).join('')
    : '<li class="list-group-item px-0 text-muted">暂无评论，来抢沙发～</li>';
}

async function buy() {
  if (!localStorage.getItem('token')) return location.href = 'login.html';
  await api('/api/order/create', {
    method: 'POST',
    body: JSON.stringify({ goodsId: Number(id) })
  });
  showToast('下单成功！请到"我的订单"确认收货', 'success');
  setTimeout(() => location.href = 'orders.html', 900);
}

async function addComment() {
  const content = document.getElementById('comment-input').value.trim();
  if (!content) return showToast('请输入评论内容', 'info');
  await api('/api/comment/add', {
    method: 'POST',
    body: JSON.stringify({ goodsId: Number(id), content })
  });
  document.getElementById('comment-input').value = '';
  showToast('评论成功', 'success');
  loadComments();
}

loadDetail();
loadComments();
</script>
</body>
</html>
