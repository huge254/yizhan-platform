<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理后台 - 易栈</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark px-3"></nav>

<div class="container mt-4">
  <h4 class="fw-bold mb-3">📊 运营数据总览</h4>
  <!-- 数据统计（带图标） -->
  <div class="row g-3 mb-4">
    <div class="col-lg col-md-4 col-6"><div class="yz-stat2 stat-c1"><div class="icon">👥</div><div><div class="num" id="stat-user">-</div><div class="label">注册用户</div></div></div></div>
    <div class="col-lg col-md-4 col-6"><div class="yz-stat2 stat-c2"><div class="icon">📦</div><div><div class="num" id="stat-goods">-</div><div class="label">商品总数</div></div></div></div>
    <div class="col-lg col-md-4 col-6"><div class="yz-stat2 stat-c3"><div class="icon">⏳</div><div><div class="num" id="stat-pending">-</div><div class="label">待审核商品</div></div></div></div>
    <div class="col-lg col-md-4 col-6"><div class="yz-stat2 stat-c4"><div class="icon">🧾</div><div><div class="num" id="stat-order">-</div><div class="label">订单数</div></div></div></div>
    <div class="col-lg col-md-4 col-6"><div class="yz-stat2 stat-c5"><div class="icon">💬</div><div><div class="num" id="stat-comment">-</div><div class="label">评论数</div></div></div></div>
  </div>

  <!-- Tab 切换 -->
  <ul class="nav nav-tabs">
    <li class="nav-item"><a class="nav-link active" id="tab-goods" href="#" onclick="switchTab('goods'); return false;">商品审核</a></li>
    <li class="nav-item"><a class="nav-link" id="tab-users" href="#" onclick="switchTab('users'); return false;">用户列表</a></li>
  </ul>

  <div class="card border-top-0 p-4" style="border-top-left-radius:0;border-top-right-radius:0;">
    <table class="table table-hover align-middle" id="goods-table">
      <thead></thead><tbody></tbody>
    </table>
    <table class="table table-hover align-middle" id="users-table" style="display:none;">
      <thead></thead><tbody></tbody>
    </table>
  </div>
</div>

<script src="common.js"></script>
<script>
renderNav('易栈', []);

if (localStorage.getItem('role') !== 'ADMIN') {
  showToast('仅管理员可访问后台', 'error');
  location.href = 'index.html';
}

function switchTab(name) {
  document.getElementById('goods-table').style.display = name === 'goods' ? '' : 'none';
  document.getElementById('users-table').style.display = name === 'users' ? '' : 'none';
  document.getElementById('tab-goods').classList.toggle('active', name === 'goods');
  document.getElementById('tab-users').classList.toggle('active', name === 'users');
}

async function loadStats() {
  const res = await api('/api/admin/stats');
  const s = res.data;
  document.getElementById('stat-user').textContent = s.userCount;
  document.getElementById('stat-goods').textContent = s.goodsCount;
  document.getElementById('stat-pending').textContent = s.pendingGoods;
  document.getElementById('stat-order').textContent = s.orderCount;
  document.getElementById('stat-comment').textContent = s.commentCount;
}

async function loadGoods() {
  const res = await api('/api/admin/goods');
  renderTable('#goods-table', res.data.list,
    [
      { key: 'id', title: 'ID' },
      { key: 'title', title: '标题' },
      { key: 'price', title: '价格' },
      { key: 'seller', title: '卖家' }
    ],
    item => `<td>${goodsBadge(item.status)} ` +
      (item.status !== 1 ? `<button class="btn btn-sm btn-success ms-2 rounded-pill px-3" onclick="setStatus(${item.id}, 1)">上架/通过</button>` : '') +
      (item.status !== 2 ? `<button class="btn btn-sm btn-outline-danger ms-1 rounded-pill px-3" onclick="setStatus(${item.id}, 2)">下架</button>` : '') +
      `</td>`);
}

async function loadUsers() {
  const res = await api('/api/admin/users');
  renderTable('#users-table', res.data.list,
    [
      { key: 'id', title: 'ID' },
      { key: 'username', title: '用户名' },
      { key: 'nickname', title: '昵称' },
      { key: 'role', title: '角色' },
      { key: 'createdAt', title: '注册时间' }
    ]);
}

async function setStatus(id, status) {
  await api('/api/admin/goods/status', {
    method: 'POST',
    body: JSON.stringify({ id, status })
  });
  showToast(status === 1 ? '已通过并上架' : '已下架', 'success');
  loadGoods();
  loadStats();
}

loadStats();
loadGoods();
loadUsers();
</script>
</body>
</html>
